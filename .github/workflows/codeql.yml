name: CodeQL

on:
  push:
    branches:
      - main
      - vnext
  pull_request:
    branches:
      - main
      - vnext
  schedule:
    - cron: '0 18 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write   # upload the SARIF results
      actions: read            # read workflow run metadata for the analysis

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    # build-mode: none - ci.yml already builds the repo, and buildless extraction is what makes
    # a run eligible for incremental overlay-base databases. It does not see generated code;
    # the source generator only emits model records.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        languages: csharp
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
