name: "Code scanning - action"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # Refit 10.x is author-signed with a certificate that currently reports as revoked,
  # which fails NuGet signature verification on the Linux runner (NU3012) during restore.
  # Disable NuGet signature verification until a re-signed Refit package is available.
  DOTNET_NUGET_SIGNATURE_VERIFICATION: false

jobs:
  CodeQL-Build:

    # Code scanning is free on public repositories but requires GitHub Advanced
    # Security (a paid add-on) on private ones. This repo is private until the
    # public flip, so the job skips itself rather than failing every run. It starts
    # working automatically the moment the repository becomes public - at which
    # point restore the weekly `schedule:` trigger that was removed above.
    if: github.event.repository.private == false

    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
      
    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      # Override language selection by uncommenting this and choosing your languages
      with:
        languages: csharp

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
