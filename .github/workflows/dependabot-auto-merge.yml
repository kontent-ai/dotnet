name: Dependabot auto-merge

# Approves and queues auto-merge for the Dependabot updates that never reach a consumer: the
# actions and tooling groups from dependabot.yml, and SDK roll-forwards in global.json. The
# runtime group and anything ungrouped wait for a human. The merge itself waits for the required
# status checks on the base branch.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  auto-merge:
    name: Queue auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Approve and enable auto-merge
        if: >-
          contains(fromJSON('["actions", "tooling"]'), steps.meta.outputs.dependency-group) ||
          (steps.meta.outputs.dependency-names == 'dotnet-sdk' &&
           steps.meta.outputs.update-type != 'version-update:semver-major')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
