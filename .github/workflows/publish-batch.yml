name: Publish batch

# Creates a GitHub Release for every product whose declared version is missing from nuget.org,
# in dependency order, waiting for each to publish before starting the next. Run it after
# merging a "Prepare release" PR. Re-running is safe - published products are skipped.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be released without creating anything'
        type: boolean
        default: true

concurrency:
  group: publish-batch
  cancel-in-progress: false

permissions:
  contents: write   # create releases and tags

jobs:
  publish:
    name: Create releases in dependency order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # GITHUB_TOKEN cannot raise workflow events, so a release it creates never starts
      # release.yml. An app installation token does. Needs `contents: write` on this repo.
      - name: Mint a token that can trigger the release workflow
        id: app-token
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Work out what needs releasing
        id: plan
        run: |
          set -euo pipefail

          # Dependency-first, one product per line:
          #   <product>\t<version>\t<tag>\t<release title>\t<"prerelease"|"">
          # Kept out of a pipeline so a dependsOn cycle (exit 1) fails the run, unlike an empty batch.
          if ! dotnet run eng/scripts/release-status.cs -- --order > /tmp/order.raw; then
            echo "::error::could not work out a release order - see the message above"
            exit 1
          fi

          # `dotnet run` writes build diagnostics to stdout, so keep only well-formed rows.
          awk -F'\t' 'NF == 5' /tmp/order.raw > /tmp/order.tsv

          if [ ! -s /tmp/order.tsv ]; then
            echo "Nothing to release - every declared version is already on NuGet."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release order:"; cut -f1 /tmp/order.tsv
          echo "count=$(wc -l < /tmp/order.tsv | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Create releases
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # release.yml refuses to publish against an unpublished cross-product dependency, and
          # waiting also stops a failed release from being followed by its dependents.
          wait_for_publish() {
            product="$1"
            for _ in $(seq 1 60); do
              if dotnet run eng/scripts/release-status.cs -- --is-published "$product" >/dev/null 2>&1; then
                echo "  $product is on NuGet"
                return 0
              fi
              sleep 30
            done
            echo "::error::$product did not appear on NuGet within 30 minutes"
            return 1
          }

          # Absorbs the cold build, whose stdout diagnostics would otherwise be published
          # into a release body - these notes have no marker to filter on.
          dotnet run eng/scripts/release-notes.cs -- --warmup >/dev/null 2>&1 || true

          while IFS=$'\t' read -r product version tag title prerelease; do
            [ -n "$product" ] || continue
            prerelease_flag=""
            [ "$prerelease" = "prerelease" ] && prerelease_flag="--prerelease"

            echo "::group::$tag"
            dotnet run eng/scripts/release-notes.cs -- "$tag" > /tmp/notes.md

            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry run] would create release '$title' at tag $tag $prerelease_flag"
              echo "--- notes ---"; cat /tmp/notes.md
              echo "::endgroup::"
              continue
            fi

            # An existing release here means a previous release.yml failed. Recreated rather than
            # edited, because release.yml only fires on `release: published`. Deleting keeps the
            # tag, and retrying is safe - the push step passes --skip-duplicate.
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "  $tag exists but its packages are not on NuGet - recreating it to retry the publish"
              gh release delete "$tag" --yes
            fi

            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file /tmp/notes.md \
              $prerelease_flag
            echo "  created $tag"

            echo "  waiting for it to publish"
            wait_for_publish "$product"
            echo "::endgroup::"
          done < /tmp/order.tsv

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run only. Re-run with 'dry_run' unchecked to create these releases."
          fi
