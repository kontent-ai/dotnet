name: Prepare release

# Bumps one or more products' versions and promotes their changelogs, then opens a single PR.
# Run it from Actions -> Prepare release -> Run workflow.
#
# Every product has its own dropdown, defaulting to `none`. Pick a bump for each product you
# want in this batch and leave the rest alone; one PR covers all of them.
#
# This does NOT publish anything. Merging the PR, then creating one GitHub Release per product
# tagged <product>-v<version>, is what triggers release.yml. Releases stay separate so a
# product can be published or abandoned without affecting the others.
on:
  workflow_dispatch:
    inputs:
      aspnetcore:
        description: 'ASP.NET Core extensions'
        type: choice
        default: none
        options: [none, prerelease, release, patch, minor, major, explicit]
      aspnetcore_version:
        description: 'ASP.NET Core - explicit version (only when bump = explicit)'
        type: string
        required: false
      delivery:
        description: 'Delivery SDK'
        type: choice
        default: none
        options: [none, prerelease, release, patch, minor, major, explicit]
      delivery_version:
        description: 'Delivery - explicit version (only when bump = explicit)'
        type: string
        required: false
      management:
        description: 'Management SDK'
        type: choice
        default: none
        options: [none, prerelease, release, patch, minor, major, explicit]
      management_version:
        description: 'Management - explicit version (only when bump = explicit)'
        type: string
        required: false
      modelgenerator:
        description: 'Model generator'
        type: choice
        default: none
        options: [none, prerelease, release, patch, minor, major, explicit]
      modelgenerator_version:
        description: 'Model generator - explicit version (only when bump = explicit)'
        type: string
        required: false
      sync:
        description: 'Sync SDK'
        type: choice
        default: none
        options: [none, prerelease, release, patch, minor, major, explicit]
      sync_version:
        description: 'Sync - explicit version (only when bump = explicit)'
        type: string
        required: false

# Two concurrent runs would open competing version PRs from the same base. Queue rather than
# cancel: a cancelled run can leave a pushed branch behind with no PR.
concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: write        # push the branch
  pull-requests: write   # open the PR

jobs:
  prepare:
    name: Bump versions and open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Inputs are user-supplied strings, so they are passed as environment variables and
      # quoted - never interpolated into the shell command itself.
      - name: Bump versions and promote changelogs
        id: bump
        env:
          ASPNETCORE: ${{ inputs.aspnetcore }}
          ASPNETCORE_VERSION: ${{ inputs.aspnetcore_version }}
          DELIVERY: ${{ inputs.delivery }}
          DELIVERY_VERSION: ${{ inputs.delivery_version }}
          MANAGEMENT: ${{ inputs.management }}
          MANAGEMENT_VERSION: ${{ inputs.management_version }}
          MODELGENERATOR: ${{ inputs.modelgenerator }}
          MODELGENERATOR_VERSION: ${{ inputs.modelgenerator_version }}
          SYNC: ${{ inputs.sync }}
          SYNC_VERSION: ${{ inputs.sync_version }}
        run: |
          set -euo pipefail

          : > /tmp/summary.txt
          : > /tmp/tags.txt

          bump_one() {
            product="$1"; bump="$2"; explicit="$3"

            if [ "$bump" = "none" ]; then
              return 0
            fi

            arg="$bump"
            if [ "$bump" = "explicit" ]; then
              if [ -z "$explicit" ]; then
                echo "::error::$product: bump is 'explicit' but no version was given"
                exit 1
              fi
              arg="$explicit"
            fi

            echo "::group::$product ($arg)"
            dotnet run eng/scripts/update-version.cs -- "$product" "$arg"
            echo "::endgroup::"

            prop=$(jq -r --arg p "$product" '.[$p].versionProperty' eng/products.json)
            new=$(dotnet msbuild eng/Versions.props -getProperty:"$prop" | tr -d '[:space:]')
            printf -- '- %s %s\n' "$product" "$new" >> /tmp/summary.txt
            printf -- '%s-v%s\n' "$product" "$new" >> /tmp/tags.txt
          }

          # Product name here must match the key in eng/products.json.
          bump_one aspnetcore      "$ASPNETCORE"     "$ASPNETCORE_VERSION"
          bump_one delivery        "$DELIVERY"       "$DELIVERY_VERSION"
          bump_one management      "$MANAGEMENT"     "$MANAGEMENT_VERSION"
          bump_one model-generator "$MODELGENERATOR" "$MODELGENERATOR_VERSION"
          bump_one sync            "$SYNC"           "$SYNC_VERSION"

          if [ ! -s /tmp/summary.txt ]; then
            echo "::error::Every product is set to 'none' - nothing to prepare."
            exit 1
          fi

          echo "Prepared:"
          cat /tmp/summary.txt

      # Folded into the PR body below. Preparing a release is the moment someone is already
      # deciding what version each product should be on, so it is the one place a stale
      # cross-product floor is actually actionable. Never fatal here: a floor is meant to lag,
      # and the scheduled Dependency floors workflow is what fails loudly if one names a
      # version that is not on NuGet at all.
      - name: Report cross-product dependency floors
        run: |
          set -uo pipefail
          dotnet build eng/scripts/dependency-floors.cs >/dev/null 2>&1 || true
          dotnet run eng/scripts/dependency-floors.cs > /tmp/floors.txt 2>/dev/null \
            || echo "(could not read dependency floors - see the Dependency floors workflow)" > /tmp/floors.txt
          cat /tmp/floors.txt

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # One branch per batch. Dated rather than versioned: a batch has no single version,
          # and the run number keeps same-day batches distinct.
          BRANCH="release/batch-$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          { echo "prepare releases"; echo; cat /tmp/summary.txt; } > /tmp/commit.txt
          git commit -a -F /tmp/commit.txt
          git push -u origin "$BRANCH"

          {
            echo "Prepared by the *Prepare release* workflow."
            echo
            cat /tmp/summary.txt
            echo
            echo "Review each version property and its promoted changelog entry, then merge."
            echo
            echo "Publishing happens per product, when a GitHub Release is created for each tag:"
            echo
            echo '```'
            cat /tmp/tags.txt
            echo '```'
            echo
            echo "Once this is merged, run **Actions -> Publish batch** to create those releases."
            echo "It releases dependency-first and waits for each product to reach NuGet before"
            echo "starting the next, so ordering is handled for you. It defaults to a dry run,"
            echo "and re-running skips whatever is already published."
            echo
            echo "Releases are independent - publish or abandon one without affecting the others."
            echo
            echo "<details><summary>Cross-product dependency floors</summary>"
            echo
            echo '```'
            cat /tmp/floors.txt
            echo '```'
            echo
            echo "Releasing a product does not change what its siblings depend on. These floors"
            echo "live in \`Directory.Packages.props\` and are raised in their own PR, after the"
            echo "dependency is on NuGet. Being behind is normal - raise a floor only when the"
            echo "consuming code needs the newer API."
            echo
            echo "</details>"
            echo
            echo "> [!NOTE]"
            echo "> Creating these releases by hand instead? Then order matters: if this batch"
            echo "> also re-points a product at a sibling's **new** version in"
            echo "> \`Directory.Packages.props\`, release that dependency first. The release"
            echo "> workflow refuses to publish a package whose cross-product \`Kontent.Ai.*\`"
            echo "> dependency is not yet on NuGet. Packages within one product are exempt -"
            echo "> they are published together."
          } > /tmp/body.md

          gh pr create \
            --title "prepare releases" \
            --body-file /tmp/body.md \
            --base main \
            --head "$BRANCH"
