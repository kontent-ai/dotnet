name: Prepare release

# Bumps the selected products' versions and promotes their changelogs, then opens one PR.
# Publishes nothing - the Publish workflow does that once this PR is merged.
on:
  workflow_dispatch:
    # One free-text field per product. Each takes a bump word - prerelease, release, patch, minor,
    # major - or an explicit version such as 21.0.0-rc.1; empty leaves the product out. The form
    # shows only per-field descriptions, so the first field carries that explanation for all five.
    inputs:
      aspnetcore:
        description: 'Each field takes prerelease, release, patch, minor, major, or a version such as 21.0.0-rc.1. Empty skips the product. This one is the ASP.NET Core extensions.'
        type: string
        required: false
      delivery:
        description: 'Delivery SDK'
        type: string
        required: false
      management:
        description: 'Management SDK'
        type: string
        required: false
      model_generator:
        description: 'Model generator'
        type: string
        required: false
      sync:
        description: 'Sync SDK'
        type: string
        required: false

# Queue rather than cancel: a cancelled run can leave a pushed branch behind with no PR.
concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: write        # push the branch
  pull-requests: write   # open the PR

jobs:
  prepare:
    name: Bump versions and open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Inputs are user-supplied: passed as quoted env vars, never interpolated into the shell.
      - name: Bump versions and promote changelogs
        id: bump
        env:
          ASPNETCORE: ${{ inputs.aspnetcore }}
          DELIVERY: ${{ inputs.delivery }}
          MANAGEMENT: ${{ inputs.management }}
          MODEL_GENERATOR: ${{ inputs.model_generator }}
          SYNC: ${{ inputs.sync }}
        run: |
          set -euo pipefail

          : > /tmp/summary.txt
          : > /tmp/tags.txt

          bump_one() {
            product="$1"; bump="$(printf '%s' "$2" | tr -d '[:space:]')"
            [ -n "$bump" ] || return 0

            echo "::group::$product ($bump)"
            dotnet run eng/scripts/update-version.cs -- "$product" "$bump"
            echo "::endgroup::"

            prop=$(jq -r --arg p "$product" '.[$p].versionProperty' eng/products.json)
            new=$(dotnet msbuild eng/Versions.props -getProperty:"$prop" | tr -d '[:space:]')
            printf -- '- %s %s\n' "$product" "$new" >> /tmp/summary.txt
            printf -- '%s-v%s\n' "$product" "$new" >> /tmp/tags.txt
          }

          # Product name here must match the key in eng/products.json.
          bump_one aspnetcore      "$ASPNETCORE"
          bump_one delivery        "$DELIVERY"
          bump_one management      "$MANAGEMENT"
          bump_one model-generator "$MODEL_GENERATOR"
          bump_one sync            "$SYNC"

          if [ ! -s /tmp/summary.txt ]; then
            echo "::error::Every product is empty - nothing to prepare."
            exit 1
          fi

          echo "Prepared:"
          cat /tmp/summary.txt

      # Folded into the PR body - the one place a stale floor is actionable. Never fatal:
      # the scheduled Dependency floors workflow is what fails on a truly broken floor.
      - name: Report cross-product dependency floors
        run: |
          set -uo pipefail
          dotnet build eng/scripts/dependency-floors.cs >/dev/null 2>&1 || true
          dotnet run eng/scripts/dependency-floors.cs > /tmp/floors.txt 2>/dev/null \
            || echo "(could not read dependency floors - see the Dependency floors workflow)" > /tmp/floors.txt
          cat /tmp/floors.txt

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Dated rather than versioned: a batch has no single version.
          BRANCH="release/batch-$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          { echo "prepare releases"; echo; cat /tmp/summary.txt; } > /tmp/commit.txt
          git commit -a -F /tmp/commit.txt
          git push -u origin "$BRANCH"

          {
            echo "Prepared by the *Prepare release* workflow."
            echo
            cat /tmp/summary.txt
            echo
            echo "Review each version property and its promoted changelog entry, then merge."
            echo
            echo "Once this is merged, run **Actions -> Publish** from this PR's base branch. It packs"
            echo "and pushes every product whose declared version is not yet on NuGet, then records"
            echo "each as a tag and a GitHub Release:"
            echo
            echo '```'
            cat /tmp/tags.txt
            echo '```'
            echo
            echo "It defaults to a dry run. A run that fails part-way is fixed by re-running that run."
            echo
            echo "Releases are independent - publish or abandon one without affecting the others."
            echo
            echo "<details><summary>Cross-product dependency floors</summary>"
            echo
            echo '```'
            cat /tmp/floors.txt
            echo '```'
            echo
            echo "Releasing a product does not change what its siblings depend on. These floors"
            echo "live in \`Directory.Packages.props\` and are raised in their own PR, after the"
            echo "dependency is on NuGet. Being behind is normal - raise a floor only when the"
            echo "consuming code needs the newer API."
            echo
            echo "</details>"
          } > /tmp/body.md

          # Against the dispatched branch, so a hotfix prepared on a maintenance branch lands there.
          gh pr create \
            --title "prepare releases" \
            --body-file /tmp/body.md \
            --base "$GITHUB_REF_NAME" \
            --head "$BRANCH"
