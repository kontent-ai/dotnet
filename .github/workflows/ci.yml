name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A monorepo PR triggers everything, so supersede in-flight runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore /p:ContinuousIntegrationBuild=true
      # Coverage is collected and ENFORCED here: each test project sets its own
      # Threshold/ThresholdType and coverlet fails the run if coverage drops below it.
      # A repo-wide number is not possible - coverage legitimately differs by an order
      # of magnitude between a thin CLI entry point and a library.
      - name: Test
        run: dotnet test --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=opencover

      # Uploaded per product with its own flag. Without flags every product's coverage
      # would merge into one repo-wide percentage, which is meaningless across a client
      # library and a CLI. Each product added to the repo needs its own step here.
      - name: Codecov (aspnetcore)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/aspnetcore/Kontent.Ai.AspNetCore.Tests/coverage.opencover.xml
          flags: aspnetcore
          fail_ci_if_error: true
      - name: Codecov (management)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/management/Kontent.Ai.Management.Tests/coverage.opencover.xml
          flags: management
          fail_ci_if_error: true
      - name: Codecov (delivery)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/delivery/Kontent.Ai.Delivery.Tests/coverage.opencover.xml,src/delivery/Kontent.Ai.Urls.Tests/coverage.opencover.xml,src/delivery/Kontent.Ai.Delivery.Abstractions.Tests/coverage.opencover.xml
          flags: delivery
          fail_ci_if_error: true
      - name: Codecov (sync)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/sync/Kontent.Ai.Sync.Tests/coverage.opencover.xml
          flags: sync
          fail_ci_if_error: true
      - name: Codecov (model-generator)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/model-generator/test/Kontent.Ai.ModelGenerator.Tests/coverage.opencover.xml,src/model-generator/test/Kontent.Ai.ModelGenerator.Core.Tests/coverage.opencover.xml
          flags: model-generator
          fail_ci_if_error: true
      - name: Restore local tools
        if: runner.os == 'Linux'
        run: dotnet tool restore
      - name: Run Slopwatch
        if: runner.os == 'Linux'
        run: dotnet slopwatch analyze -d . --fail-on warning

  project-references:
    name: Build against repo source
    runs-on: ubuntu-latest
    # Early-warning leg (§7). The default `build` job compiles every product against the
    # PUBLISHED Kontent.Ai.* packages, which is what consumers actually get. This one flips
    # those to ProjectReferences so a breaking change in one product fails in the PR that
    # makes it, rather than months later when a consumer next updates.
    #
    # Non-blocking for now: promote to a required check once it has proven stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore /p:UseProjectReferences=true
      - name: Build
        run: dotnet build --no-restore /p:UseProjectReferences=true /p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test --no-build --verbosity normal /p:UseProjectReferences=true

  pack-validation:
    name: Pack validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
      PACK_OUTPUT: ./artifacts/pack-validation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore /p:ContinuousIntegrationBuild=true
      # Packs every product listed in eng/products.json and asserts each one produced
      # the packages it claims to. Adding a product to products.json is enough; this
      # step needs no edit.
      - name: Pack and validate every product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACK_OUTPUT"
          missing=0

          for product in $(jq -r 'keys[]' eng/products.json); do
            echo "::group::pack $product"
            for proj in $(jq -r --arg p "$product" '.[$p].projects[]' eng/products.json); do
              dotnet pack "$proj" \
                --no-build \
                --configuration Release \
                --include-symbols \
                --output "$PACK_OUTPUT" \
                /p:ContinuousIntegrationBuild=true \
                /p:PackageVersion="$PACKAGE_VERSION"
            done
            for pkg in $(jq -r --arg p "$product" '.[$p].expectedPackages[]' eng/products.json); do
              if [ ! -f "${PACK_OUTPUT}/${pkg}.${PACKAGE_VERSION}.nupkg" ]; then
                echo "Missing expected package: ${pkg}.${PACKAGE_VERSION}.nupkg"
                missing=1
              fi
            done
            echo "::endgroup::"
          done

          if [ "$missing" -ne 0 ]; then
            echo "Pack validation failed. Produced:"
            ls -la "$PACK_OUTPUT"
            exit 1
          fi
      - name: Upload pack validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pack-validation-artifacts
          path: |
            ./artifacts/pack-validation/*.nupkg
            ./artifacts/pack-validation/*.snupkg
          if-no-files-found: warn

  redis-validation:
    name: Redis integration tests (delivery)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore /p:ContinuousIntegrationBuild=true
      # These tests are skipped in the normal run unless KONTENT_SDK_RUN_REDIS_TESTS is set,
      # so this job is the only thing that exercises them.
      - name: Redis integration tests
        run: dotnet test src/delivery/Kontent.Ai.Delivery.Tests/Kontent.Ai.Delivery.Tests.csproj --no-build --filter "FullyQualifiedName~RedisCacheIntegrationTests"
        env:
          KONTENT_SDK_RUN_REDIS_TESTS: "true"
          KONTENT_SDK_REDIS_CONNECTION: "localhost:6379"
