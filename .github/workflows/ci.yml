name: Build & Test

on:
  push:
    branches: [ main, vnext ]
  pull_request:
    branches: [ main, vnext ]

# A monorepo PR triggers everything, so supersede in-flight runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Explicit on every leg, so the default in Directory.Build.targets cannot silently
      # change what a job builds.
      - name: Restore dependencies
        run: dotnet restore /p:UseProjectReferences=false
      - name: Build
        run: dotnet build --no-restore /p:UseProjectReferences=false /p:ContinuousIntegrationBuild=true
      # Coverage is enforced per test project via its own coverlet threshold. Linux only: the
      # uploads below are Linux-only, and coverlet races the exiting test host on Windows.
      - name: Test
        if: runner.os == 'Linux'
        run: dotnet test --no-build --verbosity normal /p:UseProjectReferences=false /p:CollectCoverage=true /p:CoverletOutputFormat=opencover
      - name: Test (no coverage)
        if: runner.os == 'Windows'
        run: dotnet test --no-build --verbosity normal /p:UseProjectReferences=false

      # One flag per product - a merged repo-wide percentage across a library and a CLI
      # would be meaningless. A new product needs its own step here.
      - name: Codecov (aspnetcore)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/aspnetcore/Kontent.Ai.AspNetCore.Tests/coverage.opencover.xml
          flags: aspnetcore
          fail_ci_if_error: true
      - name: Codecov (management)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/management/Kontent.Ai.Management.Tests/coverage.opencover.xml
          flags: management
          fail_ci_if_error: true
      - name: Codecov (delivery)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/delivery/Kontent.Ai.Delivery.Tests/coverage.opencover.xml,src/delivery/Kontent.Ai.Urls.Tests/coverage.opencover.xml,src/delivery/Kontent.Ai.Delivery.Abstractions.Tests/coverage.opencover.xml
          flags: delivery
          fail_ci_if_error: true
      - name: Codecov (sync)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/sync/Kontent.Ai.Sync.Tests/coverage.opencover.xml
          flags: sync
          fail_ci_if_error: true
      - name: Codecov (model-generator)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/model-generator/Kontent.Ai.ModelGenerator.Tests/coverage.opencover.xml,src/model-generator/Kontent.Ai.ModelGenerator.Core.Tests/coverage.opencover.xml
          flags: model-generator
          fail_ci_if_error: true
      - name: Restore local tools
        if: runner.os == 'Linux'
        run: dotnet tool restore
      - name: Run Slopwatch
        if: runner.os == 'Linux'
        run: dotnet slopwatch analyze -d . --fail-on warning

  project-references:
    name: Build against repo source
    runs-on: ubuntu-latest
    # Early-warning leg: the `build` job compiles against published packages, this one against
    # in-repo sources, so a sibling breaking change fails in the PR that makes it. Blocking -
    # mark it required in branch protection, since only a required check blocks the merge.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore /p:UseProjectReferences=true
      - name: Build
        run: dotnet build --no-restore /p:UseProjectReferences=true /p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test --no-build --verbosity normal /p:UseProjectReferences=true

  pack-validation:
    name: Pack validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
      PACK_OUTPUT: ./artifacts/pack-validation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Explicit package mode: packing is only ever valid against the declared floors.
      - name: Restore dependencies
        run: dotnet restore /p:UseProjectReferences=false
      - name: Build
        run: dotnet build --configuration Release --no-restore /p:UseProjectReferences=false /p:ContinuousIntegrationBuild=true
      # Driven by eng/products.json, so a new product needs no edit here.
      - name: Pack and validate every product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACK_OUTPUT"
          missing=0

          for product in $(jq -r 'keys[]' eng/products.json); do
            echo "::group::pack $product"
            for proj in $(jq -r --arg p "$product" '.[$p].projects[]' eng/products.json); do
              dotnet pack "$proj" \
                --no-build \
                --configuration Release \
                --include-symbols \
                --output "$PACK_OUTPUT" \
                /p:UseProjectReferences=false \
                /p:ContinuousIntegrationBuild=true \
                /p:PackageVersion="$PACKAGE_VERSION"
            done
            for pkg in $(jq -r --arg p "$product" '.[$p].expectedPackages[]' eng/products.json); do
              if [ ! -f "${PACK_OUTPUT}/${pkg}.${PACKAGE_VERSION}.nupkg" ]; then
                echo "Missing expected package: ${pkg}.${PACKAGE_VERSION}.nupkg"
                missing=1
              fi
            done
            echo "::endgroup::"
          done

          if [ "$missing" -ne 0 ]; then
            echo "Pack validation failed. Produced:"
            ls -la "$PACK_OUTPUT"
            exit 1
          fi
      - name: Upload pack validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pack-validation-artifacts
          path: |
            ./artifacts/pack-validation/*.nupkg
            ./artifacts/pack-validation/*.snupkg
          if-no-files-found: warn

  redis-validation:
    name: Redis integration tests (delivery)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore /p:UseProjectReferences=false
      - name: Build
        run: dotnet build --no-restore /p:UseProjectReferences=false /p:ContinuousIntegrationBuild=true
      # Skipped everywhere else unless KONTENT_SDK_RUN_REDIS_TESTS is set.
      - name: Redis integration tests
        run: dotnet test src/delivery/Kontent.Ai.Delivery.Tests/Kontent.Ai.Delivery.Tests.csproj --no-build --filter "FullyQualifiedName~RedisCacheIntegrationTests" /p:UseProjectReferences=false
        env:
          KONTENT_SDK_RUN_REDIS_TESTS: "true"
          KONTENT_SDK_REDIS_CONNECTION: "localhost:6379"

  smoke-tests:
    name: Package smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pack validation proves the packages exist; this proves a consumer can install and use them,
    # by restoring from a local feed. One fixture per package shape - they fail in different ways.
    env:
      SMOKE_VERSION: 0.0.0-smoke.${{ github.run_number }}
      SMOKE_FEED: ${{ github.workspace }}/artifacts/smoke-feed
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore /p:UseProjectReferences=false
      - name: Build
        run: dotnet build --configuration Release --no-restore /p:UseProjectReferences=false

      - name: Pack into a local feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_FEED"
          for proj in $(jq -r '.[].projects[]' eng/products.json); do
            dotnet pack "$proj" --no-build --configuration Release --output "$SMOKE_FEED" \
              /p:UseProjectReferences=false /p:PackageVersion="$SMOKE_VERSION"
          done
          ls -1 "$SMOKE_FEED"

      # Resolves each client through DI.
      - name: Library consumer
        working-directory: eng/smoke/library
        run: dotnet run --configuration Release /p:KontentVersion=${{ env.SMOKE_VERSION }}

      # Roslyn silently skips a generator packed to the wrong path, so this fixture only
      # compiles if the generator actually ran.
      - name: Source generator consumer
        working-directory: eng/smoke/sourcegen
        run: dotnet run --configuration Release /p:KontentVersion=${{ env.SMOKE_VERSION }}

      # Starts a real host rather than just compiling.
      - name: ASP.NET Core consumer
        working-directory: eng/smoke/aspnetcore
        run: dotnet run --configuration Release /p:KontentVersion=${{ env.SMOKE_VERSION }}

      # Success is asserted on the tool's own validation message: a package that failed to
      # install or launch produces a host error instead.
      - name: Model generator tool
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(mktemp -d)"
          dotnet tool install Kontent.Ai.ModelGenerator \
            --version "$SMOKE_VERSION" --add-source "$SMOKE_FEED" --tool-path "$TOOLS"

          set +e
          output="$("$TOOLS/KontentModelGenerator" 2>&1)"
          set -e
          echo "$output"

          if ! grep -q "EnvironmentId" <<< "$output"; then
            echo "::error::The tool did not run its own argument validation - check the package layout."
            exit 1
          fi
          echo "tool installed and executed"
