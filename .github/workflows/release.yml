name: Publish to NuGet

# Fires when a GitHub Release is published. The tag decides which product ships:
#   aspnetcore-v0.17.0  ->  packs only src/aspnetcore, publishes Kontent.Ai.AspNetCore
# Everything else in the repo is untouched.
on:
  release:
    types: [published]

env:
  PACK_OUTPUT: ./artifacts/release-pack

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC token issuance
      contents: write   # Required for uploading release assets
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Resolves the tag into a product + project list, and refuses to continue if
      # the tag disagrees with eng/Versions.props or the changelog has no entry.
      - name: Resolve release plan
        id: plan
        run: dotnet run eng/scripts/release-plan.cs -- "$GITHUB_REF_NAME"

      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release /p:ContinuousIntegrationBuild=true /p:Version="${{ steps.plan.outputs.version }}"

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACK_OUTPUT"
          for proj in ${{ steps.plan.outputs.projects }}; do
            dotnet pack "$proj" \
              --no-build \
              --configuration Release \
              --include-symbols \
              --output "$PACK_OUTPUT" \
              /p:ContinuousIntegrationBuild=true \
              /p:PackageVersion="${{ steps.plan.outputs.version }}"
          done

      - name: Validate package artifacts
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for pkg in ${{ steps.plan.outputs.packages }}; do
            if [ ! -f "${PACK_OUTPUT}/${pkg}.${{ steps.plan.outputs.version }}.nupkg" ]; then
              echo "Missing expected package: ${pkg}.${{ steps.plan.outputs.version }}.nupkg"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Produced instead:"; ls -la "$PACK_OUTPUT"; exit 1
          fi

      # Backstop for a mis-declared internal dependency: a package that depends on a
      # Kontent.Ai.* version not yet on nuget.org would install for nobody.
      - name: Verify internal dependencies are published
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for nupkg in "$PACK_OUTPUT"/*.nupkg; do
            unzip -p "$nupkg" '*.nuspec' \
              | grep -oE '<dependency id="Kontent\.Ai\.[^"]+" version="[^"]+"' \
              | sed -E 's/.*id="([^"]+)" version="\[?([^",]+).*/\1 \2/' \
              | while read -r id ver; do
                  url="https://api.nuget.org/v3-flatcontainer/$(echo "$id" | tr 'A-Z' 'a-z')/index.json"
                  if ! curl -fsS "$url" | jq -e --arg v "$ver" '.versions | index($v)' >/dev/null; then
                    echo "Dependency $id $ver is not on nuget.org"; exit 1
                  fi
                  echo "ok: $id $ver"
                done || missing=1
          done
          [ "$missing" -eq 0 ]

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$PACK_OUTPUT/*.nupkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_KEY" --skip-duplicate
      - name: Attach artifacts to the GitHub release
        run: gh release upload "$GITHUB_REF_NAME" "$PACK_OUTPUT"/*.nupkg "$PACK_OUTPUT"/*.snupkg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
