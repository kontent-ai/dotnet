name: Publish to NuGet

# The tag decides what ships: aspnetcore-v0.17.0 packs only src/aspnetcore.
on:
  release:
    types: [published]

# Per tag, not repo-wide: GitHub keeps one pending run per group and cancels the rest, so a
# shared group would drop releases created together. publish-batch.yml sequences a batch.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  PACK_OUTPUT: ./artifacts/release-pack

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC
      contents: write   # upload release assets
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Refuses to continue if the tag disagrees with eng/Versions.props or the changelog is empty.
      - name: Resolve release plan
        id: plan
        run: dotnet run eng/scripts/release-plan.cs -- "$GITHUB_REF_NAME"

      # Explicit, not inherited: in source mode the nuspec would take sibling versions from
      # eng/Versions.props instead of the declared floors.
      - name: Restore dependencies
        run: dotnet restore /p:UseProjectReferences=false
      - name: Build
        # No /p:Version - it is global and would stamp every project in the repo.
        # eng/Versions.props already carries the right version per product.
        run: dotnet build --no-restore --configuration Release /p:UseProjectReferences=false /p:ContinuousIntegrationBuild=true

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACK_OUTPUT"
          for proj in ${{ steps.plan.outputs.projects }}; do
            dotnet pack "$proj" \
              --no-build \
              --configuration Release \
              --include-symbols \
              --output "$PACK_OUTPUT" \
              /p:UseProjectReferences=false \
              /p:ContinuousIntegrationBuild=true
          done

      - name: Validate package artifacts
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for pkg in ${{ steps.plan.outputs.packages }}; do
            if [ ! -f "${PACK_OUTPUT}/${pkg}.${{ steps.plan.outputs.version }}.nupkg" ]; then
              echo "Missing expected package: ${pkg}.${{ steps.plan.outputs.version }}.nupkg"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Produced instead:"; ls -la "$PACK_OUTPUT"; exit 1
          fi

      # A package depending on a Kontent.Ai.* version not yet on nuget.org installs for nobody.
      # Same-version siblings are exempt: this run pushes them a step later.
      - name: Verify internal dependencies are published
        shell: bash
        env:
          RELEASE_PACKAGES: ${{ steps.plan.outputs.packages }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail

          ships_in_this_release() {
            local id="$1" ver="$2" p
            [ "$ver" = "$RELEASE_VERSION" ] || return 1
            for p in $RELEASE_PACKAGES; do
              [ "$p" = "$id" ] && return 0
            done
            return 1
          }

          # nuget.org indexing lags a push by a minute or two.
          is_published() {
            local id="$1" ver="$2" url attempt
            url="https://api.nuget.org/v3-flatcontainer/$(echo "$id" | tr 'A-Z' 'a-z')/index.json"
            for attempt in 1 2 3 4 5; do
              if curl -fsS "$url" | jq -e --arg v "$ver" '.versions | index($v)' >/dev/null 2>&1; then
                return 0
              fi
              [ "$attempt" -lt 5 ] && sleep $((attempt * 15))
            done
            return 1
          }

          missing=0
          for nupkg in "$PACK_OUTPUT"/*.nupkg; do
            echo "::group::$(basename "$nupkg")"
            # `|| true`: grep exits 1 when a package has no internal dependencies - the normal
            # case for a base SDK, and fatal under `pipefail`.
            deps=$(unzip -p "$nupkg" '*.nuspec' \
              | grep -oE '<dependency id="Kontent\.Ai\.[^"]+" version="[^"]+"' \
              | sed -E 's/.*id="([^"]+)" version="\[?([^",]+).*/\1 \2/' \
              | sort -u || true)

            if [ -z "$deps" ]; then
              echo "no internal dependencies"
              echo "::endgroup::"
              continue
            fi

            # Here-string, not a pipe: a piped `while` runs in a subshell and would discard $missing.
            while read -r id ver; do
              if ships_in_this_release "$id" "$ver"; then
                echo "ships in this release: $id $ver"
              elif is_published "$id" "$ver"; then
                echo "ok: $id $ver"
              else
                echo "NOT PUBLISHED: $id $ver is not on nuget.org"
                missing=1
              fi
            done <<< "$deps"
            echo "::endgroup::"
          done
          [ "$missing" -eq 0 ]

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$PACK_OUTPUT/*.nupkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_KEY" --skip-duplicate
      - name: Attach artifacts to the GitHub release
        run: gh release upload "$GITHUB_REF_NAME" "$PACK_OUTPUT"/*.nupkg "$PACK_OUTPUT"/*.snupkg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
