name: Publish

# Packs and pushes every product whose version in eng/Versions.props is missing from nuget.org,
# and finishes any release a previous run left incomplete. Run it after merging a "Prepare
# release" PR, or from a maintenance branch for a hotfix. Defaults to a dry run.
#
# The <product>-v<version> tag is created before the first push, so a version is bound to one
# commit; the GitHub Release stays a draft until every package and asset is up. A failed run is
# fixed by re-running it - a fresh dispatch from another commit is refused for that version.
#
# The filename is part of the nuget.org trusted-publishing policy - keep it if the workflow moves.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would be published without publishing it'
        type: boolean
        default: true
      products:
        description: 'Leave empty on main or vnext: every product whose version is not on nuget.org yet gets published. On any other branch, name them, e.g. "delivery sync".'
        type: string
        required: false

concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

env:
  PACK_OUTPUT: ./artifacts/publish

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment carries the protection rules, in repository settings rather than here:
    # which branches may publish, and who approves. See README.md#releasing.
    environment: publish
    permissions:
      id-token: write   # OIDC for NuGet/login
      contents: write   # tags, releases and their assets
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Built once here so every `dotnet run --no-build` below emits only the script's own output -
      # the notes go into a release body verbatim.
      - name: Build the release scripts
        run: |
          dotnet build eng/scripts/release-status.cs
          dotnet build eng/scripts/release-notes.cs
          dotnet build eng/scripts/dependency-floors.cs

      - name: Plan
        id: plan
        env:
          PRODUCTS: ${{ inputs.products }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # An older branch declares every product at whatever version it had then, so "everything
          # unfinished" could pick up one that was never meant to ship from there.
          if [ -z "$PRODUCTS" ] && [ "$GITHUB_REF_NAME" != "main" ] && [ "$GITHUB_REF_NAME" != "vnext" ]; then
            echo "::error::Name the products to publish when running from '$GITHUB_REF_NAME'."
            exit 1
          fi

          for product in $PRODUCTS; do
            if ! jq -e --arg p "$product" 'has($p)' eng/products.json >/dev/null; then
              echo "::error::Unknown product '$product'. Known: $(jq -r 'keys | join(", ")' eng/products.json)"
              exit 1
            fi
          done

          # One product per line, alphabetical:
          #   <product>\t<version>\t<tag>\t<release title>\t<NuGet status>\t<"prerelease"|"">
          # Kept out of a pipeline so a script failure (exit 1) fails the run, unlike an empty batch.
          if ! dotnet run eng/scripts/release-status.cs --no-build -- --order --include-published > /tmp/candidates.tsv; then
            echo "::error::could not read the release status - see the message above"
            exit 1
          fi
          if [ -n "$PRODUCTS" ]; then
            awk -F'\t' -v keep=" $PRODUCTS " 'index(keep, " " $1 " ")' /tmp/candidates.tsv > /tmp/selected.tsv
          else
            cp /tmp/candidates.tsv /tmp/selected.tsv
          fi

          # A product is complete once its packages are on nuget.org and its release has left
          # draft, which the push step does last. Anything short of that is finished here.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | [.tag_name, (.draft | tostring)] | @tsv' > /tmp/releases.tsv
          : > /tmp/order.tsv
          while IFS=$'\t' read -r product version tag title status prerelease; do
            if [ "$status" = "published" ] && grep -Fqx "$(printf '%s\tfalse' "$tag")" /tmp/releases.tsv; then
              [ -z "$PRODUCTS" ] || echo "::notice::$product $version is already published and released - skipping"
              continue
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$product" "$version" "$tag" "$title" "$status" "$prerelease" >> /tmp/order.tsv
          done < /tmp/selected.tsv

          if [ ! -s /tmp/order.tsv ]; then
            echo "Nothing to publish - packages and GitHub releases are complete."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Publish order:"
          cut -f1,2,5 /tmp/order.tsv | sed 's/^/  /'
          echo "count=$(wc -l < /tmp/order.tsv | tr -d ' ')" >> "$GITHUB_OUTPUT"
          {
            echo "## Publish order ($GITHUB_SHA)"
            echo
            awk -F'\t' '{ print "- " $1 " " $2 " (" $5 ")" }' /tmp/order.tsv
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published dependency floors
        if: steps.plan.outputs.count != '0'
        run: dotnet run eng/scripts/dependency-floors.cs --no-build

      # Explicit, not inherited: in source mode the nuspec would take sibling versions from
      # eng/Versions.props instead of the declared floors. Restore alone is not an exact floor
      # check: NuGet can resolve a higher version with warning NU1603.
      - name: Restore dependencies
        if: steps.plan.outputs.count != '0'
        run: dotnet restore /p:UseProjectReferences=false
      - name: Build
        if: steps.plan.outputs.count != '0'
        # No /p:Version - it is global and would stamp every project in the repo.
        # eng/Versions.props already carries the right version per product.
        run: dotnet build --no-restore --configuration Release /p:UseProjectReferences=false /p:ContinuousIntegrationBuild=true

      - name: Pack and render release notes
        if: steps.plan.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r product version tag title status prerelease; do
            out="$PACK_OUTPUT/$product"
            mkdir -p "$out"
            echo "::group::$tag"

            for proj in $(jq -r --arg p "$product" '.[$p].projects[]' eng/products.json); do
              dotnet pack "$proj" \
                --no-build \
                --configuration Release \
                --include-symbols \
                --output "$out" \
                /p:UseProjectReferences=false \
                /p:ContinuousIntegrationBuild=true
            done

            missing=0
            for pkg in $(jq -r --arg p "$product" '.[$p].expectedPackages[]' eng/products.json); do
              if [ ! -f "$out/$pkg.$version.nupkg" ]; then
                echo "::error::Missing expected package: $pkg.$version.nupkg"
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              echo "Produced instead:"; ls -la "$out"; exit 1
            fi

            # Fails when the changelog has no '## <version>' heading or the entry is empty.
            dotnet run eng/scripts/release-notes.cs --no-build -- "$tag" > "$out/notes.md"
            echo "--- release notes ---"
            cat "$out/notes.md"
            { echo "## $title"; echo; cat "$out/notes.md"; echo; } >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done < /tmp/order.tsv
          cp /tmp/order.tsv "$PACK_OUTPUT/order.tsv"
          printf '%s\n' "$GITHUB_SHA" > "$PACK_OUTPUT/commit.txt"

      - name: Retain release artifacts
        if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PACK_OUTPUT }}
          if-no-files-found: error

      - name: Dry run
        if: steps.plan.outputs.count != '0' && inputs.dry_run
        run: echo "Dry run only. Re-run with 'dry_run' unchecked to push these packages and create their releases."

      # Tagged after everything local has succeeded and before anything irreversible: a version
      # belongs to exactly one commit from here on, whatever happens to the pushes below.
      - name: Tag the release commit
        if: steps.plan.outputs.count != '0' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r product version tag _; do
            # The second pattern lists the peeled commit of an annotated tag, last; a lightweight
            # tag lists its commit once. Either way the last line is the commit.
            existing=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n1 | cut -f1)
            if [ -z "$existing" ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
            elif [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::$tag is at $existing, not $GITHUB_SHA. Re-run the publish run that created it. Delete the tag only if none of $product $version reached nuget.org."
              exit 1
            fi
          done < /tmp/order.tsv

      - name: NuGet login
        if: steps.plan.outputs.count != '0' && !inputs.dry_run
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push and record releases
        if: steps.plan.outputs.count != '0' && !inputs.dry_run
        shell: bash
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          while IFS=$'\t' read -r product version tag title status prerelease; do
            out="$PACK_OUTPUT/$product"
            echo "::group::$tag"

            # --skip-duplicate makes a re-run after a partial failure a no-op for what already landed.
            # Symbols go separately: NuGet skips a package's symbols when the package itself was a
            # duplicate, so a retry after a failed symbol upload would otherwise never push them.
            dotnet nuget push "$out/*.nupkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_KEY" --skip-duplicate --no-symbols
            dotnet nuget push "$out/*.snupkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_KEY" --skip-duplicate

            # Draft until the assets are up: leaving draft is what marks the release complete.
            if ! gh release view "$tag" >/dev/null 2>&1; then
              prerelease_flag=""
              [ "$prerelease" = "prerelease" ] && prerelease_flag="--prerelease"
              gh release create "$tag" \
                --verify-tag \
                --draft \
                --title "$title" \
                --notes-file "$out/notes.md" \
                $prerelease_flag
            fi
            gh release upload "$tag" "$out"/*.nupkg "$out"/*.snupkg --clobber
            gh release edit "$tag" --draft=false
            echo "::endgroup::"
          done < /tmp/order.tsv
