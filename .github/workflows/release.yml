name: Publish to NuGet

# Fires when a GitHub Release is published. The tag decides which product ships:
#   aspnetcore-v0.17.0  ->  packs only src/aspnetcore, publishes Kontent.Ai.AspNetCore
# Everything else in the repo is untouched.
on:
  release:
    types: [published]

# Scoped to the tag, NOT shared across releases. A repo-wide group would serialize releases,
# which sounds desirable for a batch - but GitHub keeps only one PENDING run per group and
# cancels older pending ones, so creating five releases at once would silently drop the middle
# three. Sequencing a batch is the dispatcher's job (publish-batch.yml), which waits for each
# release to finish before creating the next. Here the group only prevents the same tag from
# publishing twice concurrently, e.g. if a release is edited and re-published.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  PACK_OUTPUT: ./artifacts/release-pack

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC token issuance
      contents: write   # Required for uploading release assets
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Resolves the tag into a product + project list, and refuses to continue if
      # the tag disagrees with eng/Versions.props or the changelog has no entry.
      - name: Resolve release plan
        id: plan
        run: dotnet run eng/scripts/release-plan.cs -- "$GITHUB_REF_NAME"

      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        # No /p:Version here. It is a GLOBAL property, so it would stamp the releasing
        # product's version onto every project in the repo - and, once in-repo dependencies
        # are ProjectReferences, onto sibling dependency versions in the generated nuspec.
        # eng/Versions.props already carries the right version per product, and the
        # "Resolve release plan" step above refuses to continue if it disagrees with the tag.
        run: dotnet build --no-restore --configuration Release /p:ContinuousIntegrationBuild=true

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACK_OUTPUT"
          for proj in ${{ steps.plan.outputs.projects }}; do
            dotnet pack "$proj" \
              --no-build \
              --configuration Release \
              --include-symbols \
              --output "$PACK_OUTPUT" \
              /p:ContinuousIntegrationBuild=true
          done

      - name: Validate package artifacts
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for pkg in ${{ steps.plan.outputs.packages }}; do
            if [ ! -f "${PACK_OUTPUT}/${pkg}.${{ steps.plan.outputs.version }}.nupkg" ]; then
              echo "Missing expected package: ${pkg}.${{ steps.plan.outputs.version }}.nupkg"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Produced instead:"; ls -la "$PACK_OUTPUT"; exit 1
          fi

      # Backstop for a mis-declared internal dependency: a package that depends on a
      # Kontent.Ai.* version not yet on nuget.org would install for nobody.
      #
      # Packages within one product reference each other as ProjectReferences, so they pack as
      # same-version dependencies (Kontent.Ai.Delivery 19.5.0 -> Kontent.Ai.Delivery.Abstractions
      # 19.5.0). Those siblings are pushed by THIS run a step later, so asking nuget.org about
      # them here would always fail. They are exempted; everything else must already be live.
      # (nuget.org accepts a package whose dependencies are not yet indexed - dependencies are
      # resolved at restore time - so publishing the batch together is safe.)
      - name: Verify internal dependencies are published
        shell: bash
        env:
          RELEASE_PACKAGES: ${{ steps.plan.outputs.packages }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail

          # Is this dependency one of the packages this very run is about to publish?
          ships_in_this_release() {
            local id="$1" ver="$2" p
            [ "$ver" = "$RELEASE_VERSION" ] || return 1
            for p in $RELEASE_PACKAGES; do
              [ "$p" = "$id" ] && return 0
            done
            return 1
          }

          # nuget.org indexing lags a little behind a push, so a correctly ordered
          # dependency-first release can still look unpublished for a minute or two.
          is_published() {
            local id="$1" ver="$2" url attempt
            url="https://api.nuget.org/v3-flatcontainer/$(echo "$id" | tr 'A-Z' 'a-z')/index.json"
            for attempt in 1 2 3 4 5; do
              if curl -fsS "$url" | jq -e --arg v "$ver" '.versions | index($v)' >/dev/null 2>&1; then
                return 0
              fi
              [ "$attempt" -lt 5 ] && sleep $((attempt * 15))
            done
            return 1
          }

          missing=0
          for nupkg in "$PACK_OUTPUT"/*.nupkg; do
            echo "::group::$(basename "$nupkg")"
            # `|| true` because grep exits 1 when a package declares no internal dependencies.
            # That is the normal case for a base SDK (Kontent.Ai.Management, Kontent.Ai.Urls,
            # both Abstractions packages, ...), not an error - and under `pipefail` it would
            # otherwise fail the whole step.
            deps=$(unzip -p "$nupkg" '*.nuspec' \
              | grep -oE '<dependency id="Kontent\.Ai\.[^"]+" version="[^"]+"' \
              | sed -E 's/.*id="([^"]+)" version="\[?([^",]+).*/\1 \2/' \
              | sort -u || true)

            if [ -z "$deps" ]; then
              echo "no internal dependencies"
              echo "::endgroup::"
              continue
            fi

            # Fed by here-string rather than a pipe: a piped `while` runs in a subshell, so
            # assignments to $missing inside it would be discarded.
            while read -r id ver; do
              if ships_in_this_release "$id" "$ver"; then
                echo "ships in this release: $id $ver"
              elif is_published "$id" "$ver"; then
                echo "ok: $id $ver"
              else
                echo "NOT PUBLISHED: $id $ver is not on nuget.org"
                missing=1
              fi
            done <<< "$deps"
            echo "::endgroup::"
          done
          [ "$missing" -eq 0 ]

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$PACK_OUTPUT/*.nupkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_KEY" --skip-duplicate
      - name: Attach artifacts to the GitHub release
        run: gh release upload "$GITHUB_REF_NAME" "$PACK_OUTPUT"/*.nupkg "$PACK_OUTPUT"/*.snupkg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
