# Codecov reports, it does not gate - each test project's coverlet threshold is the real gate,
# enforced by `dotnet test` in ci.yml. Codecov's default `target: auto` would additionally fail a
# pure refactor that shifts the ratio by a fraction of a percent.
#
# To move a coverage floor, move the coverlet threshold in the relevant test project.

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
